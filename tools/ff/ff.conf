# Firefox Shortcuts Configuration
# Format: shortcut | category | label | profile | url
#
# Lines starting with # are comments
# Blank lines are ignored
# 'profile' is the Firefox profile name to use (-p flag)
# 'url' is the URL or local path to open
#
# For multi-URL shortcuts (e.g. opening several tabs at once), separate
# each profile:url pair with a space in the url field:
#   mails | General | All Email Accounts | MULTI | profile1 url1 profile2 url2 profile3 url3
#
# The special category token MULTI in the profile field signals that the url
# field contains space-delimited "profile url" pairs.

